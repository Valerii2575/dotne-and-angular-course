<div class="modal-header">
  <h4 class="modal-title pull-left">
    {{title}}
  </h4>
  <button type="button" class="btn-close close-pull-right" (click)="bsModalRef.hide()">
    <span class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="for-check" *ngFor="let role of availableRoles; track $index">
    <input type="checkbox"
          class="form-chek-input"
          [checked]="selectedRoles.includes(role)"
          value="role"
          (change)="updateChecked(role)"
          [disabled]="role === 'Admin'">
    <label>{{role}}</label>
  </div>
</div>
<div class="modal-footer">
  <button class="btn btn-success"
  [disabled]="selectedRoles.length === 0"
          type="button"
          (click)="onSelectRoles()">
    Submit
  </button>
</div>
